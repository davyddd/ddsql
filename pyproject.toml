[project]
name = "ddsql"
description = "SQL Query Library"
version = "0.1.0"
authors = [{ name = "davyddd" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["python", "ddsql"]
dependencies = [
    "ddutils>=0.2.0,<0.3.0",
    "jinja2>=3.0.0,<4.0.0",
]

[project.urls]
Repository = "https://github.com/davyddd/ddsql"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==9.16.1",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "parameterized==0.9.0",
]
linter = [
    "ruff==0.15.10",
    "ty==0.0.15",
    "complexipy==8.0.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
