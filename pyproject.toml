[project]
name = "ddsql"
description = "SQL queries from Jinja2 templates with typed results and Postgres and ClickHouse adapters"
version = "0.4.1"
authors = [{ name = "davyddd" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.15"
keywords = ["python", "ddsql", "sql", "raw sql", "sql templates", "jinja2", "query builder", "serialization", "sql injection", "postgres", "postgresql", "clickhouse", "adapter", "asyncio"]
# uv_build does not derive these from requires-python (poetry did); PyPI and the pyversions badge read them
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "ddutils>=0.3.1,<0.5.0",
    "jinja2>=3.0.0,<4.0.0",
]

[project.urls]
Repository = "https://github.com/davyddd/ddsql"

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "ipython==9.16.1",
]
test = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "parameterized==0.9.0",
]
linter = [
    "ruff==0.15.10",
    "ty==0.0.15",
    "complexipy==8.0.1",
]

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
